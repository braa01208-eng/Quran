<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد وفاحص كلمات المرور</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 24px;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            color: #0f172a;
            direction: ltr;
            text-align: left;
            font-family: monospace;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #2563eb;
            background-color: #ffffff;
        }
        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-copy {
            background-color: #10b981;
            color: #ffffff;
            padding: 0 18px;
            font-size: 14px;
        }
        .btn-copy:hover {
            background-color: #059669;
        }
        .strength-box {
            background-color: #f8fafc;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }
        .strength-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .bar-bg {
            width: 100%;
            height: 8px;
            background-color: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .option-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background-color: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        input[type="range"] {
            width: 140px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .btn-generate {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 16px;
        }
        .btn-generate:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>مولد وفاحص كلمات المرور</h1>
        <p class="subtitle">أنشئ كلمة مرور قوية أو اكتب كلمتك لفحص أمانها</p>

        <div class="input-group">
            <input type="text" id="pwdInput" placeholder="اكتب أو اضغط توليد..." oninput="evaluatePassword()">
            <button class="btn-copy" id="copyBtn" onclick="copyPassword()">نسخ</button>
        </div>

        <div class="strength-box">
            <div class="strength-header">
                <span>مستوى الأمان:</span>
                <strong id="strengthLabel">-</strong>
            </div>
            <div class="bar-bg">
                <div class="bar-fill" id="strengthBar"></div>
            </div>
        </div>

        <div class="options">
            <div class="option-row">
                <label for="lenSlider">طول كلمة المرور: <strong id="lenValue">16</strong></label>
                <input type="range" id="lenSlider" min="6" max="32" value="16" oninput="updateLength()">
            </div>
            <div class="option-row">
                <label for="optUpper">أحرف كبيرة (A-Z)</label>
                <input type="checkbox" id="optUpper" checked onchange="createPassword()">
            </div>
            <div class="option-row">
                <label for="optLower">أحرف صغيرة (a-z)</label>
                <input type="checkbox" id="optLower" checked onchange="createPassword()">
            </div>
            <div class="option-row">
                <label for="optNum">أرقام (0-9)</label>
                <input type="checkbox" id="optNum" checked onchange="createPassword()">
            </div>
            <div class="option-row">
                <label for="optSym">رموز خاصة (!@#$)</label>
                <input type="checkbox" id="optSym" checked onchange="createPassword()">
            </div>
        </div>

        <button class="btn-generate" onclick="createPassword()">توليد كلمة مرور جديدة</button>
    </div>

    <script>
        function updateLength() {
            document.getElementById('lenValue').textContent = document.getElementById('lenSlider').value;
            createPassword();
        }

        function createPassword() {
            var length = parseInt(document.getElementById('lenSlider').value, 10);
            var useUpper = document.getElementById('optUpper').checked;
            var useLower = document.getElementById('optLower').checked;
            var useNum = document.getElementById('optNum').checked;
            var useSym = document.getElementById('optSym').checked;

            var charset = '';
            if (useUpper) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (useLower) charset += 'abcdefghijklmnopqrstuvwxyz';
            if (useNum) charset += '0123456789';
            if (useSym) charset += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            if (charset === '') {
                document.getElementById('optLower').checked = true;
                charset = 'abcdefghijklmnopqrstuvwxyz';
            }

            var result = '';
            for (var i = 0; i < length; i++) {
                var randomIndex = Math.floor(Math.random() * charset.length);
                result += charset.charAt(randomIndex);
            }

            document.getElementById('pwdInput').value = result;
            evaluatePassword();
        }

        function evaluatePassword() {
            var pwd = document.getElementById('pwdInput').value;
            var bar = document.getElementById('strengthBar');
            var label = document.getElementById('strengthLabel');

            if (pwd.length === 0) {
                bar.style.width = '0%';
                label.textContent = '-';
                label.style.color = '#64748b';
                return;
            }

            var score = 0;
            if (pwd.length >= 8) score++;
            if (pwd.length >= 12) score++;
            if (/[A-Z]/.test(pwd)) score++;
            if (/[0-9]/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;

            if (score <= 2) {
                bar.style.width = '30%';
                bar.style.backgroundColor = '#ef4444';
                label.textContent = 'ضعيفة';
                label.style.color = '#ef4444';
            } else if (score <= 4) {
                bar.style.width = '65%';
                bar.style.backgroundColor = '#f59e0b';
                label.textContent = 'متوسطة';
                label.style.color = '#f59e0b';
            } else {
                bar.style.width = '100%';
                bar.style.backgroundColor = '#10b981';
                label.textContent = 'قوية جداً';
                label.style.color = '#10b981';
            }
        }

        function copyPassword() {
            var input = document.getElementById('pwdInput');
            if (!input.value) return;
            input.select();
            input.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                var btn = document.getElementById('copyBtn');
                btn.textContent = 'تم النسخ';
                setTimeout(function() {
                    btn.textContent = 'نسخ';
                }, 1500);
            } catch (err) {
                console.error('Copy failed', err);
            }
        }

        window.addEventListener('DOMContentLoaded', createPassword);
    </script>
</body>
</html>
